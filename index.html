<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>실험용 3D 포인트 클라우드 (조건 선택·잠금 · 가이드/자유 탐색 · 로그)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{ --bg:#0b0b0c; --panel:#101114; --panel2:#0f1012; --text:#e6e6e6; --muted:#a6a6a6; --acc:#7aa2ff; --border:#23252b; --chip:#17181c; --shadow:0 12px 40px rgba(0,0,0,.45); }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    #app{display:grid; grid-template-columns: 1fr; height:100%}
    #stage{position:relative; height:100%; background:#000}
    #ui{ position:absolute; top:10px; left:10px; z-index:10; background:rgba(0,0,0,.55); color:#eee; padding:12px 14px; border-radius:12px; box-shadow:var(--shadow); font-size:12px; line-height:1.5; min-width:340px; border:1px solid var(--border) }
    #ui label{display:block;margin:8px 0 4px;font-weight:700}
    #legend{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
    .chip{display:flex;align-items:center;gap:6px;border:1px solid #444;border-radius:10px;padding:4px 8px;background:#111;color:#ddd}
    .dot{width:12px;height:12px;border-radius:6px;display:inline-block;border:1px solid rgba(255,255,255,.35)}
    .muted{color:var(--muted)} .row{display:flex; gap:8px; align-items:center} .row>*:not(label){flex:1}
    .btn{border:1px solid var(--border); background:#16181d; color:#eee; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700}
    .btn:disabled{opacity:.5; cursor:not-allowed}
    #tooltip{ position:fixed;z-index:20;pointer-events:none; background:rgba(0,0,0,.9);color:#fff;padding:6px 8px;border-radius:8px;font-size:12px; transform:translate(12px,-12px);white-space:nowrap;display:none; box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.12); max-width:360px; line-height:1.45; }
    canvas{display:block}
    #taskPanel.card{position:absolute;top:10px;right:10px;z-index:10;background:rgba(0,0,0,.55); color:#eee;padding:12px 14px;border-radius:12px;border:1px solid var(--border);width:360px}
    #taskPanel h4{margin:0 0 6px 0} #taskPanel .btnNext{margin-top:8px}
    #sessionBar{position:absolute; right:10px; bottom:10px; display:flex; gap:8px; z-index:10}
    #inspector.card{position:absolute; left:10px; bottom:60px; z-index:10; background:rgba(0,0,0,.55); color:#eee; padding:12px 14px; border-radius:12px; border:1px solid var(--border); width:380px; line-height:1.5}
    #gear{position:absolute; left:10px; bottom:10px; z-index:10; opacity:.6}
  </style>

  <script type="importmap">
  {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
<div id="app">
  <section id="stage">
    <button id="gear" class="btn" title="설정">⚙︎</button>

    <div id="ui">
      <div style="font-weight:800;margin-bottom:6px">실험 설정 (조건 고정)</div>
      <div class="row"><span class="muted">색상 기준</span><span>유형 (사용자/속성/행동)</span></div>
      <div class="row"><span class="muted">선택 모드</span>
        <div style="display:flex;gap:6px">
          <label><input type="radio" name="selmode" id="selPoint" checked> 점</label>
          <label><input type="radio" name="selmode" id="selCluster"> 클러스터</label>
          <span class="muted">(Shift+클릭=클러스터)</span>
        </div>
      </div>

      <label>크기 <span id="sizeVal"></span></label>
      <input id="size" type="range" min="1" max="10" step="1" value="3" disabled>

      <label>반경(구 반경) <span id="radVal"></span></label>
      <input id="radius" type="range" min="20" max="140" step="2" value="70" disabled>

      <label>클러스터 퍼짐(σ) <span id="sprVal"></span></label>
      <input id="spread" type="range" min="2" max="30" step="1" value="10" disabled>

      <div id="debugControls" style="margin-top:10px; display:none">
        <label>조건 불러오기 (파일럿 전용)</label>
        <div class="row">
          <button id="lowLoad" class="btn" type="button">낮은 부하: N=500</button>
          <button id="highLoad" class="btn" type="button">높은 부하: N=5000</button>
        </div>
        <div class="row" style="margin-top:8px">
          <input id="nInput" type="number" min="100" max="20000" step="100" value="5000" placeholder="포인트 개수 N">
          <button id="applyN" class="btn" type="button">적용</button>
        </div>
        <div class="muted" style="margin-top:6px">※ 라벨: 낮은 부하=상위 100개, 높은 부하=전체(겹침 허용)</div>
      </div>

      <div id="legend" style="margin-top:10px"></div>
      <div class="muted" style="margin-top:6px">색상: 회색=사용자 · 자홍=속성(추론) · 파랑=행동 | 드래그: 회전 · 휠: 확대/축소</div>
    </div>

    <div id="taskPanel" class="card"></div>
    <div id="tooltip"></div>
    <div id="inspector" class="card"></div>
  </section>
</div>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";

  const MAP = {
    "LC-G": { N: 500,  labelLimit: 100, size: 3.0, overlay: false, guided: true,  sigma: 10 },
    "LC-S": { N: 500,  labelLimit: 100, size: 3.0, overlay: false, guided: false, sigma: 10 },
    "HC-G": { N: 5000, labelLimit: Infinity, size: 3.6, overlay: true,  guided: true,  sigma: 35 },
    "HC-S": { N: 5000, labelLimit: Infinity, size: 3.6, overlay: true,  guided: false, sigma: 35 }
  };

  let COND = "LC-G";
  let CFG = MAP[COND];
  let DEBUG = false;
  const K = 4;
  let N = 0;
  let RADIUS = 70, SIGMA = CFG.sigma, SIZE = CFG.size;
  let LABEL_LIMIT = CFG.labelLimit;

  const USE_SEEDED_RANDOM = false;
  let seed = 42;
  function rnd(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; }
  function R(){ return USE_SEEDED_RANDOM ? rnd() : Math.random(); }

  const stageEl = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stageEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 5000);
  camera.position.set(120,120,180);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const light = new THREE.DirectionalLight(0xffffff, 0.6);
  light.position.set(1,1,1);
  scene.add(light);

  const sizeVal  = document.getElementById("sizeVal");
  const radVal   = document.getElementById("radVal");
  const sprVal   = document.getElementById("sprVal");
  function syncLabels(){
    sizeVal.textContent = String(SIZE);
    radVal.textContent = String(RADIUS);
    sprVal.textContent = String(SIGMA);
  }

  const TYPE_COLORS = {
    user:  new THREE.Color(0xb3b3b3),
    attr:  new THREE.Color(0xff2bb3),
    act:   new THREE.Color(0x64b5f6)
  };

  const CLUSTER_NAMES = ['야간형','가족 중심형','규칙형','저사용형'];

  const CLUSTER_METRICS = [
    { id: 0, name: '야간형', night_interval_min: 45, fridge_opens_night: 8.2 },
    { id: 1, name: '가족 중심형', night_interval_min: 120, fridge_opens_night: 2.1 },
    { id: 2, name: '규칙형', night_interval_min: 240, fridge_opens_night: 1.5 },
    { id: 3, name: '저사용형', night_interval_min: 180, fridge_opens_night: 3.3 }
  ];

  const legend = document.getElementById("legend");
  legend.innerHTML = '';
  (function(){
    const items = [
      {label:'사용자', color: TYPE_COLORS.user},
      {label:'속성(추론)', color: TYPE_COLORS.attr},
      {label:'행동', color: TYPE_COLORS.act}
    ];
    for (let i=0;i<items.length;i++){
      const item = items[i];
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.style.pointerEvents = 'none';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = '#' + item.color.getHexString();
      const label = document.createElement('span');
      label.textContent = item.label;
      chip.appendChild(dot);
      chip.appendChild(label);
      legend.appendChild(chip);
    }
  })();

  const ATTR_NAMES = [
    "AttributeScore_HouseholdType_ParentOfPreschooler(4-5yrs)",
    "AttributeScore_HouseholdType_ParentStatus",
    "AttributeScore_HouseholdType_ParentOfAdult(18-26yrs)",
    "AttributeScore_HouseholdType_Senior",
    "AttributeScore_HouseholdType_ApartmentResident",
    "AttributeScore_HouseholdType_ParentOfInfant(0-1yr)",
    "AttributeScore_Interest_TVEnthusiast-TVGameProgram",
    "AttributeScore_Interest_Health-HealthCare",
    "AttributeScore_Interest_Gamer-MobileGame",
    "AttributeScore_Interest_Beauty-SkinCare",
    "AttributeScore_Interest_Education-University/Graduate",
    "AttributeScore_Interest_RealEstate-Apartment",
    "AttributeScore_Interest_Shopping-Luxury",
    "AttributeScore_Interest_MediaEntertainment-TVEnthusiast",
    "AttributeScore_Interest_Food-KoreanCuisine",
    "AttributeScore_Interest_MobileGameUsage"
  ];

  const ACT_NAMES = [
    "Washer_AllergyCare_LargeLoad_Wash",
    "Washer_AI_SmallLoad_Wash",
    "Dryer_AI_Dry",
    "Styler_Sterilize",
    "MicrowaveOven_Oven_Cook",
    "Refrigerator_FridgeDoor_LongTime_Open",
    "Dishwasher_Auto_Wash",
    "Cooktop_MultipleBurners_HighHeat_LongTime_Use",
    "WaterPurifier_HotWater_MediumAmount_Dispense",
    "AirConditioner_TempChangeFrequent_LongTime_Cooling",
    "AirPurifier_ShortTime_AirPurify",
    "LateNight_Refrigerator_Open"
  ];

  const ATTR_CATEGORY_MAP = { HouseholdType: '가구 특성', Interest: '관심사' };

  const ATTR_TOKEN_MAP = {
    ParentOfPreschooler: '미취학 자녀 양육 가구', ParentStatus: '부모 여부',
    ParentOfAdult: '성인 자녀가 있는 가구', Senior: '시니어 가구',
    ApartmentResident: '아파트 거주 가구', ParentOfInfant: '영아 양육 가구',
    TVEnthusiast: 'TV 관심도 높음', TVGameProgram: 'TV 게임 프로그램 선호',
    Health: '건강', HealthCare: '헬스케어', Gamer: '게이머', MobileGame: '모바일 게임',
    Beauty: '뷰티', SkinCare: '스킨케어', Education: '교육', University: '대학교',
    Graduate: '대학원', RealEstate: '부동산', Apartment: '아파트', Shopping: '쇼핑',
    Luxury: '명품', MediaEntertainment: '미디어·엔터테인먼트', Food: '식품',
    KoreanCuisine: '한식', MobileGameUsage: '모바일 게임 이용'
  };

  const ACTION_TOKEN_MAP = {
    Washer: '세탁기', AllergyCare: '알레르기 케어', LargeLoad: '대용량', Wash: '세탁',
    AI: 'AI', SmallLoad: '소량', Dryer: '건조기', Dry: '건조', Styler: '스타일러',
    Sterilize: '살균', MicrowaveOven: '광파오븐', Oven: '오븐', Cook: '조리',
    Refrigerator: '냉장고', FridgeDoor: '냉장실 문', LongTime: '장시간', Open: '열림',
    Dishwasher: '식기세척기', Auto: '자동', Cooktop: '쿡탑', MultipleBurners: '다중 화구',
    HighHeat: '고화력', Use: '사용', WaterPurifier: '정수기', HotWater: '온수',
    MediumAmount: '중간 용량', Dispense: '출수', AirConditioner: '에어컨',
    TempChangeFrequent: '온도 변경 잦음', Cooling: '냉방', AirPurifier: '공기청정기',
    ShortTime: '단시간', AirPurify: '공기 청정', LateNight: '심야'
  };

  function splitAndTranslate(part, dict, fallbackSeparator = ' · ') {
    const tokens = part.split(/[_-]/g).filter(Boolean);
    return tokens.map(t => dict[t] || t).join(fallbackSeparator);
  }

  function prettyAttr(raw){
    if (!raw) return '속성';
    let s = raw.replace(/^AttributeScore_/, '');
    const parts = s.split('_');
    const category = parts.shift() || '';
    const translatedCategory = ATTR_CATEGORY_MAP[category] || category;
    if (parts.length === 0) return translatedCategory || '속성';
    const translatedParts = parts.map(part => {
      if (ATTR_TOKEN_MAP[part]) return ATTR_TOKEN_MAP[part];
      if (part.includes('-')) return part.split('-').map(x => ATTR_TOKEN_MAP[x] || x).join(' › ');
      if (part.includes('/')) return part.split('/').map(x => ATTR_TOKEN_MAP[x] || x).join('/');
      return ATTR_TOKEN_MAP[part] || part;
    });
    return [translatedCategory, ...translatedParts].join(' › ');
  }

  function prettyAct(raw){
    if (!raw) return '행동';
    const parts = raw.split('_').filter(Boolean);
    const translated = parts.map(part => ACTION_TOKEN_MAP[part] || part);
    return translated.join(' · ');
  }

  let positions, colors, clusterOf, labels, typeOf, meta, device;
  let geom, mat, points, selGeom, selMat, selPoints, sphereWire;

  function showSphereWire(R){ return; }

  function spriteTex(size){
    if(!size) size=32;
    const c=document.createElement("canvas");
    c.width=c.height=size;
    const ctx=c.getContext("2d");
    const r=size/2;
    ctx.clearRect(0,0,size,size);
    ctx.fillStyle="white";
    ctx.beginPath(); ctx.arc(r,r,r,0,Math.PI*2); ctx.fill();
    const tex=new THREE.CanvasTexture(c);
    tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
    tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
    return tex;
  }

  const sprite = spriteTex(32);

  function disposePoints(){
    if(points){ scene.remove(points); geom.dispose(); mat.dispose(); points=null; }
    if(selPoints){ scene.remove(selPoints); selGeom.dispose(); selMat.dispose(); selPoints=null; }
  }

  function rebuildBuffers(newN){
    N = newN|0; if (N < 100) N = 100;
    disposePoints();
    if (N === 0) {
      positions=new Float32Array(0); colors=new Float32Array(0);
      clusterOf=new Int32Array(0); labels=new Array(0); typeOf=new Array(0);
    } else {
      positions=new Float32Array(N*3); colors=new Float32Array(N*3);
      clusterOf=new Int32Array(N); labels=new Array(N); typeOf=new Array(N);
    }
    geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(positions,3));
    geom.setAttribute("color", new THREE.BufferAttribute(colors,3));
    mat = new THREE.PointsMaterial({ size: SIZE, map:sprite, alphaTest:0.5, transparent:true, vertexColors:true, sizeAttenuation:true });
    points = new THREE.Points(geom, mat); scene.add(points);
    selGeom = new THREE.BufferGeometry();
    selGeom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N*3),3));
    selMat = new THREE.PointsMaterial({ size: SIZE*1.8, map:sprite, alphaTest:0.5, transparent:true, color:0xffffff, sizeAttenuation:true });
    selPoints = new THREE.Points(selGeom, selMat); scene.add(selPoints);
  }

  function randN(){ return (R()*2-1)+(R()*2-1)+(R()*2-1); }
  function randOnSphere(){
    const u=R()*2*Math.PI, v=Math.acos(R()*2-1);
    return new THREE.Vector3(Math.sin(v)*Math.cos(u), Math.sin(v)*Math.sin(u), Math.cos(v));
  }
  function sampleInBall(center, Rr, sigma){
    return new THREE.Vector3(center.x+randN()*sigma, center.y+randN()*sigma, center.z+randN()*sigma);
  }

  function computeCenters(){
    const r=RADIUS*0.5;
    const base=[
      new THREE.Vector3(1,1,1), new THREE.Vector3(-1,1,-1),
      new THREE.Vector3(1,-1,-1), new THREE.Vector3(-1,-1,1)
    ].map(v => v.normalize().multiplyScalar(r));
    for(let i=0;i<K;i++) base[i].add(randOnSphere().multiplyScalar(RADIUS*0.08));
    return base;
  }

  function applyColors(){
    if (N === 0) return;
    const colArr = geom.getAttribute('color').array;
    for(let i=0;i<N;i++){
      const ty = typeOf[i] || 'user';
      const c = (ty==='user') ? TYPE_COLORS.user : (ty==='attr' ? TYPE_COLORS.attr : TYPE_COLORS.act);
      colArr[i*3]=c.r; colArr[i*3+1]=c.g; colArr[i*3+2]=c.b;
    }
    geom.getAttribute('color').needsUpdate = true;
  }

  function synthesizeDeviceFlags(){
    if (N === 0) return;
    device = new Array(N);
    for(let i=0;i<N;i++){
      const k = clusterOf[i];
      let pTV=0.25,pMobile=0.45,pIPad=0.30,pFridge=0.85,pWasher=0.78;
      if(k===1){ pTV=0.95;pMobile=0.80;pIPad=0.60;pFridge=0.92;pWasher=0.85; }
      device[i] = { tv:R()<pTV, mobile:R()<pMobile, ipad:R()<pIPad, fridge:R()<pFridge, washer:R()<pWasher };
    }
  }

  function regenerate(){
    if (N === 0) { disposePoints(); showSphereWire(RADIUS); clearSelection(); syncLabels(); return; }
    showSphereWire(RADIUS);
    const centers = computeCenters();
    const clusterRatios = [0.45, 0.25, 0.15, 0.15];
    const clusterCounts = [];
    let allocatedTotal = 0;
    for(let k=0;k<K;k++){ const count=Math.floor(N*clusterRatios[k]); clusterCounts.push(count); allocatedTotal+=count; }
    const remainder = N - allocatedTotal;
    if(remainder > 0) clusterCounts[0] += remainder;

    meta = new Array(N);
    const nUser = Math.max(1, Math.floor(N*0.25));
    const nAttr = Math.max(1, Math.floor(N*0.35));
    const typesPool = [];
    for(let i=0;i<nUser;i++) typesPool.push('user');
    for(let i=0;i<nAttr;i++) typesPool.push('attr');
    for(let i=typesPool.length;i<N;i++) typesPool.push('act');
    for(let i2=typesPool.length-1;i2>0;i2--){ const j=Math.floor(R()*(i2+1)); const tmp=typesPool[i2]; typesPool[i2]=typesPool[j]; typesPool[j]=tmp; }

    let idx=0, ai=0, ci=0;

    if (idx < N) {
      const k=0, c=centers[k], p=sampleInBall(c,RADIUS,SIGMA);
      positions[idx*3]=p.x; positions[idx*3+1]=p.y; positions[idx*3+2]=p.z;
      clusterOf[idx]=k; typeOf[idx]='attr';
      const rawName = "AttributeScore_Interest_Gamer-MobileGame";
      labels[idx] = prettyAttr(rawName);
      meta[idx] = { rawId: rawName, id: labels[idx], type:'attr', cluster:k, clusterName: CLUSTER_NAMES[k] };
      typesPool.pop(); idx++;
    }
    if (idx < N) {
      const k=0, c=centers[k], p=sampleInBall(c,RADIUS,SIGMA);
      positions[idx*3]=p.x; positions[idx*3+1]=p.y; positions[idx*3+2]=p.z;
      clusterOf[idx]=k; typeOf[idx]='act';
      const rawName = "Refrigerator_FridgeDoor_LongTime_Open";
      labels[idx] = prettyAct(rawName);
      meta[idx] = { rawId: rawName, id: labels[idx], type:'act', cluster:k, clusterName: CLUSTER_NAMES[k] };
      typesPool.pop(); idx++;
    }

    for(let k=0;k<K && idx<N;k++){
      const c=centers[k], countForThisCluster=clusterCounts[k];
      for(let i=0;i<countForThisCluster && idx<N;i++){
        const p=sampleInBall(c,RADIUS,SIGMA);
        positions[idx*3]=p.x; positions[idx*3+1]=p.y; positions[idx*3+2]=p.z;
        clusterOf[idx]=k;
        const ty = typesPool.pop() || 'act';
        typeOf[idx]=ty;
        if (ty==='user'){
          const uid='U-'+String(idx).padStart(5,'0'); labels[idx]=uid;
          meta[idx] = { id:uid, type:'user', cluster:k, clusterName:CLUSTER_NAMES[k], group:Math.floor(idx/20) };
        } else if (ty==='attr'){
          const rawName=ATTR_NAMES[ai%Math.max(ATTR_NAMES.length,1)]||'속성'; ai++;
          labels[idx]=prettyAttr(rawName);
          meta[idx] = { rawId:rawName, id:labels[idx], type:'attr', cluster:k, clusterName:CLUSTER_NAMES[k] };
        } else {
          const rawName=ACT_NAMES[ci%Math.max(ACT_NAMES.length,1)]||'행동'; ci++;
          labels[idx]=prettyAct(rawName);
          meta[idx] = { rawId:rawName, id:labels[idx], type:'act', cluster:k, clusterName:CLUSTER_NAMES[k] };
        }
        idx++;
      }
    }
    for(;idx<N;idx++){
      const k2=0, p2=sampleInBall(centers[k2],RADIUS,SIGMA);
      positions[idx*3]=p2.x; positions[idx*3+1]=p2.y; positions[idx*3+2]=p2.z;
      clusterOf[idx]=k2;
      const ty2=typesPool.pop()||'act'; typeOf[idx]=ty2;
      if(ty2==='user'){ const uid2='U-'+String(idx).padStart(5,'0'); labels[idx]=uid2; meta[idx]={id:uid2,type:'user',cluster:k2,clusterName:CLUSTER_NAMES[k2],group:Math.floor(idx/20)}; }
      else if(ty2==='attr'){ const rn=ATTR_NAMES[ai%Math.max(ATTR_NAMES.length,1)]||'속성'; ai++; labels[idx]=prettyAttr(rn); meta[idx]={rawId:rn,id:labels[idx],type:'attr',cluster:k2,clusterName:CLUSTER_NAMES[k2]}; }
      else { const rn=ACT_NAMES[ci%Math.max(ACT_NAMES.length,1)]||'행동'; ci++; labels[idx]=prettyAct(rn); meta[idx]={rawId:rn,id:labels[idx],type:'act',cluster:k2,clusterName:CLUSTER_NAMES[k2]}; }
    }
    synthesizeDeviceFlags(); applyColors();
    geom.attributes.position.needsUpdate=true;
    clearSelection(); mat.size=SIZE; mat.needsUpdate=true; renderOnce(); syncLabels();
  }

  function clearSelection(){
    if(!selGeom || N===0) return;
    selGeom.setDrawRange(0,0);
    const a=selGeom.getAttribute("position"); if(a) a.needsUpdate=true;
  }

  const tooltip=document.getElementById("tooltip");
  const PICK_RADIUS_PX=16;
  const _v3=new THREE.Vector3();
  function getViewport(){ const v=new THREE.Vector2(); renderer.getSize(v); return {w:v.x,h:v.y}; }
  function projectToScreen(i){
    if(N===0||i<0||i>=N) return {x:0,y:0,z:0};
    _v3.set(positions[i*3],positions[i*3+1],positions[i*3+2]).project(camera);
    const vh=getViewport();
    return {x:(_v3.x*0.5+0.5)*vh.w, y:(-_v3.y*0.5+0.5)*vh.h, z:_v3.z};
  }

  function findClosestPoint(px,py,r){
    if(N===0) return -1;
    const rad=(r||PICK_RADIUS_PX), r2=rad*rad;
    let best=-1, bestD2=Infinity;
    for(let i=0;i<N;i++){
      const p=projectToScreen(i); if(p.z<-1||p.z>1) continue;
      const dx=p.x-px, dy=p.y-py, d2=dx*dx+dy*dy;
      if(d2<=r2 && d2<bestD2){ bestD2=d2; best=i; }
    }
    return best;
  }

  let hoverIndex=-1;
  window.addEventListener("pointermove", function(e){
    if(!renderer||!renderer.domElement||N===0) return;
    const rect=renderer.domElement.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    hoverIndex=findClosestPoint(px,py,PICK_RADIUS_PX);
    if(hoverIndex!==-1) showTooltip(hoverIndex,e.clientX,e.clientY);
    else hideTooltip();
  });

  function showTooltip(i,x,y){
    if(N===0||i<0||i>=N||i>=LABEL_LIMIT){ hideTooltip(); return; }
    const m=meta[i];
    tooltip.style.left=String(x+12)+"px"; tooltip.style.top=String(y-12)+"px";
    if(m.type==='user'){
      const d=device[i];
      const dev=[d.tv?'TV✓':'TV–',d.mobile?'모바일✓':'모바일–',d.ipad?'iPad✓':'iPad–',d.fridge?'냉장고✓':'냉장고–',d.washer?'세탁기✓':'세탁기–'].join(' · ');
      tooltip.innerHTML='<div style="font-weight:700;margin-bottom:2px">'+m.id+'</div>유형: 사용자 · 클러스터: '+m.clusterName+'<br/>기기: '+dev;
    } else if(m.type==='attr'){
      tooltip.innerHTML='<div style="font-weight:700;margin-bottom:2px">'+m.id+'</div>유형: 속성(추론) · 클러스터: '+m.clusterName;
    } else {
      tooltip.innerHTML='<div style="font-weight:700;margin-bottom:2px">'+m.id+'</div>유형: 행동 · 클러스터: '+m.clusterName;
    }
    tooltip.style.display='block';
  }
  function hideTooltip(){ tooltip.style.display='none'; }

  function indicesWhere(pred){ if(N===0) return []; const arr=[]; for(let i=0;i<N;i++) if(pred(i)) arr.push(i); return arr; }

  let selectionMode = 'point';
  const selPointEl = document.getElementById('selPoint');
  const selClusterEl = document.getElementById('selCluster');
  if(selPointEl) selPointEl.addEventListener('change', function(e){ if(e.target.checked) selectionMode='point'; });
  if(selClusterEl) selClusterEl.addEventListener('change', function(e){ if(e.target.checked) selectionMode='cluster'; });

  function updateInspector(singleIndex, indices){
    const panel=document.getElementById('inspector');
    if(!panel) return;
    if(N===0){ panel.innerHTML='<h4>데이터가 아직 불러와지지 않았습니다</h4><div class="muted">실험 조건을 선택해 데이터를 불러와 주세요.</div>'; return; }
    if(typeof singleIndex==='undefined') singleIndex=null;
    if(!indices) indices=null;
    if(singleIndex===null && !indices){ panel.innerHTML='<h4>선택 없음</h4><div class="muted">점 또는 클러스터를 선택해 주세요.</div>'; return; }
    if(singleIndex!==null){
      if(singleIndex<0||singleIndex>=N){ panel.innerHTML='<h4>선택 오류</h4>'; return; }
      const m=meta[singleIndex];
      if(m.type==='user'){
        const d=device[singleIndex];
        panel.innerHTML='<h4>'+m.id+'</h4><div>유형: <b>사용자</b> · 클러스터: <b>'+m.clusterName+'</b></div><div class="muted">그룹: '+m.group+'</div><div style="margin-top:6px">기기: '+[d.tv?'TV✓':'TV–',d.mobile?'모바일✓':'모바일–',d.ipad?'iPad✓':'iPad–',d.fridge?'냉장고✓':'냉장고–',d.washer?'세탁기✓':'세탁기–'].join(' · ')+'</div>';
      } else if(m.type==='attr'){
        panel.innerHTML='<h4>'+m.id+'</h4><div>유형: <b>속성(추론)</b> · 클러스터: <b>'+m.clusterName+'</b></div>';
      } else {
        panel.innerHTML='<h4>'+m.id+'</h4><div>유형: <b>행동</b> · 클러스터: <b>'+m.clusterName+'</b></div>';
      }
      return;
    }
    if(!indices||indices.length===0||clusterOf[indices[0]]===undefined){ panel.innerHTML='<h4>선택 오류</h4>'; return; }
    const k=clusterOf[indices[0]];
    const metrics=CLUSTER_METRICS[k];
    const userIdx=indices.filter(i=>typeOf[i]==='user');
    const n=userIdx.length||1;
    const c={tv:0,mobile:0,ipad:0,fridge:0,washer:0};
    userIdx.forEach(i=>{ const d=device[i]; c.tv+=d.tv?1:0; c.mobile+=d.mobile?1:0; c.ipad+=d.ipad?1:0; c.fridge+=d.fridge?1:0; c.washer+=d.washer?1:0; });
    function pct(x){ return Math.round(100*x/n)+'%'; }
    panel.innerHTML='<h4>'+metrics.name+' 클러스터 (사용자 n='+n+')</h4><div>평균 야간 사용 간격: '+metrics.night_interval_min+'분</div><div>야간 냉장고 열림 횟수: '+metrics.fridge_opens_night+'회</div><div style="margin-top:6px">주요 기기: TV '+pct(c.tv)+' · 모바일 '+pct(c.mobile)+' · iPad '+pct(c.ipad)+' · 냉장고 '+pct(c.fridge)+' · 세탁기 '+pct(c.washer)+'</div>';
  }

  updateInspector();

  renderer.domElement.addEventListener('click', function(e){
    if(N===0) return;
    if(hoverIndex===-1){ clearSelection(); updateInspector(); log('click',{hoverIndex:-1}); return; }
    if(hoverIndex<0||hoverIndex>=N){ clearSelection(); updateInspector(); return; }
    if(selectionMode==='cluster'||e.shiftKey){
      const k=clusterOf[hoverIndex];
      const idxs=indicesWhere(i=>clusterOf[i]===k);
      const out=selGeom.getAttribute('position').array;
      let cnt=0;
      for(let ii=0;ii<idxs.length;ii++){ const i=idxs[ii]; out[cnt*3]=positions[i*3]; out[cnt*3+1]=positions[i*3+1]; out[cnt*3+2]=positions[i*3+2]; cnt++; }
      selGeom.setDrawRange(0,cnt); selGeom.getAttribute('position').needsUpdate=true;
      log('click',{mode:'cluster',hoverIndex:hoverIndex,cluster:k});
      updateInspector(null,idxs);
    } else {
      const out2=selGeom.getAttribute('position').array;
      out2[0]=positions[hoverIndex*3]; out2[1]=positions[hoverIndex*3+1]; out2[2]=positions[hoverIndex*3+2];
      selGeom.setDrawRange(0,1); selGeom.getAttribute('position').needsUpdate=true;
      log('click',{mode:'point',hoverIndex:hoverIndex,cluster:clusterOf[hoverIndex]});
      updateInspector(hoverIndex,null);
    }
  });

  function resize(){
    const w=stageEl.clientWidth, h=stageEl.clientHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();

  function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
  function renderOnce(){ renderer.render(scene,camera); }
  animate();

  /* ====== Task Panel (MODIFIED) ====== */
  const TASKS = [
    "화면에는 4개의 점 무리(클러스터)가 보입니다.<br>각 클러스터를 <b>Shift+클릭</b>하면 좌측 하단 패널에 <b>'야간 냉장고 열림 횟수'</b>가 표시됩니다.<br>이 값이 높은 <b>상위 3개 클러스터</b>를 찾아 비교해 보세요.",
    "'야간형' 클러스터와 '가족 중심형' 클러스터를 각각 <b>Shift+클릭</b>하여 선택해 보세요.<br>좌측 하단 패널에 표시되는 <b>'평균 야간 사용 간격(분)'</b> 값을 비교하고 메모해 주세요.<br><span class='muted'>힌트: 야간형은 간격이 짧고, 가족 중심형은 간격이 긴 편입니다.</span>",
    "'야간형' 클러스터 내부의 <b style='color:#ff2bb3'>분홍색 점(속성)</b>과 <b style='color:#64b5f6'>파란색 점(행동)</b>에 마우스를 올려 보세요.<br>툴팁에서 아래 두 항목을 찾을 수 있는지 확인해 주세요.<br><br>① 속성: <b>관심사 › 게이머 › 모바일 게임</b><br>② 행동: <b>냉장고 · 냉장실 문 · 장시간 · 열림</b>"
  ];

  function mountTasks(){
    const el=document.getElementById("taskPanel");

    if(!CFG.guided){
      el.innerHTML = "<h4>자유 탐색</h4>"
        + "<div>야간 냉장고 사용과 관련된 흥미로운 패턴 <b>1가지</b>를 찾아보세요.</div>"
        + "<div style='margin-top:8px; padding:8px 10px; background:rgba(255,255,255,.07); border-radius:8px; font-size:11.5px; line-height:1.6'>"
        + "<b>탐색 방법 안내</b><br>"
        + "· <b>마우스 드래그</b>: 3D 공간 회전<br>"
        + "· <b>마우스 휠</b>: 확대/축소<br>"
        + "· <b>점 위에 마우스 올리기</b>: 툴팁으로 상세 정보 확인<br>"
        + "· <b>클릭</b>: 개별 점 선택 → 좌측 하단 패널에서 상세 정보 확인<br>"
        + "· <b>Shift+클릭</b>: 클러스터 전체 선택 → 좌측 하단 패널에서 클러스터 요약 확인"
        + "</div>"
        + "<div style='margin-top:8px; font-size:11.5px; color:var(--muted); line-height:1.5'>"
        + "<b>패턴 예시</b>: 특정 클러스터에서 반복적으로 나타나는 속성이나 행동, 클러스터 간 야간 사용 빈도의 차이, 특정 기기 보유율과 행동의 관계 등"
        + "</div>";
      return;
    }

    let idx=0;
    function render(){
      el.innerHTML =
        '<h4>가이드 과업 '+(idx+1)+'/'+TASKS.length+'</h4>' +
        '<div>'+TASKS[idx]+'</div>' +
        (idx === 0 ? '<div style="margin-top:8px; padding:6px 8px; background:rgba(255,255,255,.07); border-radius:8px; font-size:11px; line-height:1.5; color:var(--muted)">'
          + '<b>조작 안내</b>: 마우스 드래그=회전 · 휠=확대/축소 · 점 위 마우스=툴팁 · 클릭=개별 선택 · Shift+클릭=클러스터 선택</div>' : '') +
        '<button class="btn btnNext" id="nextStep" type="button" style="margin-top:8px">'+(idx<TASKS.length-1?'다음':'완료')+'</button>';
    }
    render();
    el.onclick = function(e){
      const t=e.target;
      if(t && t.id==="nextStep"){
        log("guide_next",{step:idx+1});
        idx++;
        if(idx>=TASKS.length){
          el.innerHTML='<h4>가이드 과업 완료</h4><div>감사합니다. 실험이 종료되었습니다.</div><button class="btn btnNext" type="button" style="margin-top:8px;" disabled>완료됨</button>';
        } else { render(); }
      }
    };
  }

  /* ====== Log ====== */
  const qs = new URLSearchParams(location.search);
  const PID = qs.get("panel_id") || "test_pid";
  const logs = [];
  function nowISO(){ return new Date().toISOString(); }
  function log(t, det){
    if(!det) det={};
    logs.push(Object.assign({ ts:nowISO(), panel_id:PID, condition:COND, event:t }, det));
    fetch("https://script.google.com/macros/s/AKfycbyrgYV9VXZCELJxp12maCn8F4McWM42aWrP2RltTb_SWr5lmEiJo5YA88VNZOp275zt/exec", {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({ panel_id:PID, condition:COND, event:t, detail:det||{} })
    });
  }

  function applyCondition(cond, opt){
    if(!MAP[cond]){ alert("유효하지 않은 조건입니다."); return; }
    COND=cond; CFG=MAP[cond]; DEBUG=opt&&opt.debug?true:false;
    SIZE=CFG.size; LABEL_LIMIT=CFG.labelLimit; N=CFG.N; SIGMA=CFG.sigma;
    const dbg=document.getElementById("debugControls");
    if(dbg) dbg.style.display=DEBUG?"block":"none";
    rebuildBuffers(N); regenerate(); showSphereWire(RADIUS); mountTasks();
    log("session_start",{cfg:CFG});
  }

  const lowBtn=document.getElementById("lowLoad");
  const highBtn=document.getElementById("highLoad");
  const nInput=document.getElementById("nInput");
  const applyNBtn=document.getElementById("applyN");
  if(lowBtn) lowBtn.onclick=function(){ LABEL_LIMIT=100; SIZE=3.0; rebuildBuffers(500); regenerate(); log("debug_low"); };
  if(highBtn) highBtn.onclick=function(){ LABEL_LIMIT=Infinity; SIZE=3.6; rebuildBuffers(5000); regenerate(); log("debug_high"); };
  if(applyNBtn) applyNBtn.onclick=function(){ const v=parseInt(nInput.value,10); if(isNaN(v)||v<100||v>20000){ alert("N 값은 100~20000 사이여야 합니다."); return; } rebuildBuffers(v); regenerate(); log("debug_applyN",{N:v}); };

  window.addEventListener('error', function(e){
    try{ console.error(e.error||e.message); }catch(_){}
    alert('스크립트 오류: '+(e.error&&e.error.message?e.error.message:e.message));
  });

  syncLabels(); resize();
  const condition = qs.get("condition") || "LC-G";
  applyCondition(condition);
  updateInspector();
</script>
</body>
</html>
